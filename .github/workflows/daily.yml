name: Daily Telegram reports

# Fixed SGT times (UTC+8, no daylight saving):
#   dashboard 19:00 SGT Mon-Fri, before the US open
#   recap     06:00 SGT Tue-Sat, after the US close
# On US market holidays the job exits without sending.
on:
  schedule:
    - cron: "0 11 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: Which report to run
        type: choice
        options: [dashboard, recap]
        required: true
      date:
        description: US session date to report on (YYYY-MM-DD); empty for the scheduled date
        type: string
        required: false
      dry_run:
        description: Print to the log instead of sending to Telegram
        type: boolean
        default: false

permissions:
  contents: read
  models: read

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DAILY_DATE: ${{ inputs.date }}
  DAILY_DRY_RUN: ${{ inputs.dry_run }}

jobs:
  dashboard:
    if: github.event.schedule == '0 11 * * 1-5' || inputs.job == 'dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRADINGAGENTS_LLM_PROVIDER: openai_compatible
      TRADINGAGENTS_LLM_BACKEND_URL: https://models.github.ai/inference
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.GITHUB_TOKEN }}
      TRADINGAGENTS_DEEP_THINK_LLM: ${{ vars.TRADINGAGENTS_DEEP_THINK_LLM }}
      TRADINGAGENTS_QUICK_THINK_LLM: ${{ vars.TRADINGAGENTS_QUICK_THINK_LLM }}
      DAILY_ANALYSTS: ${{ vars.DAILY_ANALYSTS || 'market,news,fundamentals' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      # The memory log lets each decision learn from earlier ones. Runners are
      # wiped after every run, so carry it forward in the Actions cache.
      - name: Restore memory log
        uses: actions/cache/restore@v4
        with:
          path: ~/.tradingagents/memory
          key: ta-memory-${{ github.run_id }}
          restore-keys: ta-memory-
      - name: Run dashboard
        run: |
          args=(dashboard)
          [ -n "$DAILY_DATE" ] && args+=(--date "$DAILY_DATE")
          [ "$DAILY_DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m tradingagents.daily "${args[@]}"
      - name: Save memory log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.tradingagents/memory
          key: ta-memory-${{ github.run_id }}

  recap:
    if: github.event.schedule == '0 22 * * 1-5' || inputs.job == 'recap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run recap
        run: |
          args=(recap)
          [ -n "$DAILY_DATE" ] && args+=(--date "$DAILY_DATE")
          [ "$DAILY_DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m tradingagents.daily "${args[@]}"
